<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Nexiq - Buy Premium Mobile Covers, Cases & Accessories Online</title>

    <meta
      name="title"
      content="Nexiq - Buy Premium Mobile Covers, Cases & Accessories Online"
    />

    <meta
      name="description"
      content="Shop premium mobile covers, phone cases, chargers, earphones, tempered glass and latest smartphone accessories at Nexiq. Fast delivery and secure payment."
    />

    <meta
      name="keywords"
      content="mobile covers, phone covers, mobile accessories, smartphone accessories, iphone cover, samsung cover, chargers, earphones, tempered glass, buy phone accessories online, Nexiq"
    />

    <meta name="author" content="Nexiq Store" />

    <!-- Search Engine -->
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#ef4444" />

    <!-- Open Graph (Facebook / WhatsApp) -->
    <meta
      property="og:title"
      content="Nexiq - Premium Mobile Covers & Accessories"
    />

    <meta
      property="og:description"
      content="Explore premium mobile covers, chargers, earphones and phone accessories at best prices."
    />

    <meta property="og:image" content="/logo.png" />

    <meta property="og:url" content="https://yourdomain.com" />

    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Nexiq - Premium Mobile Covers & Accessories"
    />

    <meta
      name="twitter:description"
      content="Buy mobile covers, chargers, earphones and premium smartphone accessories online."
    />

    <meta name="twitter:image" content="/logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://yourdomain.com" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- <script src="https://checkout.razorpay.com/v1/checkout.js"></script> -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </body>
</html>
